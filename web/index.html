<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#D8E1F5"><title>旅人天气 TravelWeather</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="original.css"><link rel="stylesheet" href="style.css"></head>
<body><main><header><button id="theme" aria-label="切换主题">☾</button><h1>旅人天气</h1><button id="refresh" aria-label="刷新天气" aria-busy="false"><svg class="refresh-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17.657 6.343 A8 8 0 1 1 6.343 6.343 M3.5 6.343 H6.343 V9.186" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg></button></header><div id="pullRefresh" class="pull-refresh" aria-hidden="true">下拉刷新</div><section id="location" class="location"><p>查看所在地天气</p><button id="locate">定位当前城市</button></section><div id="cards"></div><button id="add" class="add">＋<br>添加城市</button><p id="lastUpdated" class="last-updated" aria-live="polite">天气更新时间：暂无</p><footer><span class="footer-brand">旅人天气 · Travel Weather</span><br>（天气数据：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · 城市数据：和风天气 / GeoNames）</footer></main><dialog id="searchDialog"><form method="dialog" class="searchbar"><button aria-label="返回">←</button><input type="text" inputmode="text" lang="zh-CN" enterkeyhint="search" id="search" placeholder="搜索城市..." autocomplete="off" aria-label="搜索城市"><button aria-label="关闭">×</button></form><div id="results">输入城市名搜索</div></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
