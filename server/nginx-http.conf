# HTTP serves ACME challenges only. Address lookups require HTTPS.
server {
    listen 80;
    server_name 43.134.98.67;
    access_log off;
    error_log /var/log/nginx/travelweather-error.log crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/travelweather-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
