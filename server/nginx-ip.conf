# Put limit_req_zone directives in nginx's http context (conf.d is normally included there).
limit_req_zone $binary_remote_addr zone=tw_ip:10m rate=6r/m;
limit_req_zone $server_name zone=tw_total:1m rate=30r/m;

server {
    listen 443 ssl;
    server_name 43.134.98.67;
    ssl_certificate /etc/letsencrypt/live/travelweather-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travelweather-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/travelweather-error.log crit;
    client_max_body_size 1k;
    location = /v1/reverse-geocode {
        limit_except GET { deny all; }
        limit_req zone=tw_ip burst=3 nodelay;
        limit_req zone=tw_total burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
